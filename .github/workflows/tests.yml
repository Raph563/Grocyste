name: Tests du CORE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier le serveur et ses outils
        run: python -m pytest
      - name: Vérifier le SDK JavaScript
        run: node --test web/sdk.test.mjs
      - name: Construire le chargeur navigateur
        run: node web/build.mjs
